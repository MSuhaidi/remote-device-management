networks:
  dashboard-net:
    driver: bridge

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./data/app.db
    networks:
      - dashboard-net

  agent:
    build: ./agent
    depends_on:
      backend:
        condition: service_started
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
      - DEVICE_NAME=docker-agent-01
    networks:
      - dashboard-net

  frontend:
    build:
      context: ./frontend
    ports:
      - "4173:4173"
    env_file:
      - .env
    environment:
      - VITE_BACKEND_URL=http://backend:8000
      - VITE_API_TOKEN
    depends_on:
      - backend
    networks:
      - dashboard-net

volumes:
  backend_data:
